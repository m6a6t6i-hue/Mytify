[package]
name = "mytify-core"
version = "0.9.0"
edition = "2021"
publish = false

[lib]
name = "mytify_core"

[[bin]]
name = "mytify"
path = "src/main.rs"

[features]
default = []
embed-ui = ["dep:include_dir"]
desktop = ["dep:wry", "dep:tao", "dep:souvlaki", "dep:windows", "dep:windows-core"]
# Tests on systems without a credential store (Linux CI) keep passwords in memory.
memory-secrets = []

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
lofty = "0.25.5"
sha2 = "0.10.9"
walkdir = "2.5"
unicode-normalization = "0.1"
tiny_http = "0.12"
url = "2.5"
getrandom = "0.3"
flacenc = { version = "0.5.1", default-features = false }
md5 = { package = "md-5", version = "0.10" }
sha1 = "0.10"
base64 = "0.22"
mdns-sd = "0.22.0"
roxmltree = "0.21.1"
libloading = "0.8.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
if-addrs = "0.15"
include_dir = { version = "0.7", optional = true }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

symphonia = { version = "0.5.5", features = ["all"] }
rubato = "0.16.2"
rtrb = "0.3"
mp3lame-encoder = "0.2"
fdk-aac = "0.8"

[target.'cfg(windows)'.dependencies]
cpal = "0.18.2"
rfd = "0.18.0"
wry = { version = "0.57.3", optional = true }
tao = { version = "0.37.3", optional = true }
souvlaki = { version = "0.9.3", default-features = false, optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Security", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# COM objects implemented here (the app-recording completion handler).
windows-core = { version = "0.62", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_WNet", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"

# DSP must keep up with the device clock even in a debug/test build.
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.mytify-core]
opt-level = 2

# Keep small GUI/dependency code, but prioritize playback throughput for DSP.
[profile.release.package.rubato]
opt-level = 3
[profile.release.package.mytify-core]
opt-level = 3
