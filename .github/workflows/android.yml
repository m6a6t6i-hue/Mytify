name: Android test APK
on: [workflow_dispatch]
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Install CMake 3.31.6 for the native AirPlay module
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" > /dev/null
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --release --target-platform android-arm64 --no-pub
      - name: Local Samba share for the network source tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq samba smbclient > /dev/null
          album="/srv/mytify-share/Polskie ąę albumy"
          sudo mkdir -p "$album"
          sudo cp test/fixtures/sample.flac "$album/a.flac"
          sudo cp test/fixtures/sample.mp3 "$album/Zażółć gęślą jaźń.mp3"
          sudo useradd -M -s /usr/sbin/nologin mytifysmb
          printf 'Mytify-Test-2026!\nMytify-Test-2026!\n' | sudo smbpasswd -s -a mytifysmb
          sudo sed -i 's/^\[global\]/[global]\n   server min protocol = SMB2_10/' /etc/samba/smb.conf
          printf '[music]\n   path = /srv/mytify-share\n   read only = yes\n   valid users = mytifysmb\n' | sudo tee -a /etc/samba/smb.conf > /dev/null
          sudo systemctl restart smbd
          smbclient -L 127.0.0.1 -U 'mytifysmb%Mytify-Test-2026!' | head -20 || true
      - name: Local HTTPS WebDAV servers for the network source tests
        run: |
          pip install -q wsgidav cheroot
          d="$RUNNER_TEMP/dav"; mkdir -p "$d/root/Polskie ąę albumy"; cd "$d"
          cp "$GITHUB_WORKSPACE/test/fixtures/sample.flac" "root/Polskie ąę albumy/a.flac"
          cp "$GITHUB_WORKSPACE/test/fixtures/sample.mp3" "root/Polskie ąę albumy/Zażółć gęślą jaźń.mp3"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 2 -subj "/CN=Mytify Test CA" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost" 2>/dev/null
          printf "subjectAltName=DNS:localhost\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 2 -extfile ext.cnf 2>/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -keyout self.key -out self.pem -days 2 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" 2>/dev/null
          # Trust only the test CA in the test JVM; the untrusted server must stay untrusted.
          sudo "$JAVA_HOME/bin/keytool" -importcert -cacerts -storepass changeit -noprompt -alias mytify-test-ca -file ca.pem
          nohup python3 "$GITHUB_WORKSPACE/tools/dav_test_server.py" "$d/root" 18443 server.pem server.key mat Haslo-123 > dav1.log 2>&1 &
          nohup python3 "$GITHUB_WORKSPACE/tools/dav_test_server.py" "$d/root" 18444 self.pem self.key mat Haslo-123 > dav2.log 2>&1 &
          nohup python3 "$GITHUB_WORKSPACE/tools/norange_test_server.py" "$d/root" 18445 server.pem server.key > nr.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null --cacert ca.pem https://localhost:18443/dav/ && break; sleep 1; done
      - name: Local Navidrome for the music server tests
        run: |
          d="$RUNNER_TEMP/navidrome"; mkdir -p "$d/music/Polskie ąę albumy" "$d/data"; cd "$d"
          curl -sSL https://github.com/navidrome/navidrome/releases/download/v0.58.0/navidrome_0.58.0_linux_amd64.tar.gz | tar xz navidrome
          cp "$GITHUB_WORKSPACE/test/fixtures/sample.flac" "music/Polskie ąę albumy/a.flac"
          cp "$GITHUB_WORKSPACE/test/fixtures/sample.mp3" "music/Polskie ąę albumy/Zażółć gęślą jaźń.mp3"
          ND_MUSICFOLDER="$d/music" ND_DATAFOLDER="$d/data" ND_PORT=14533 ND_ADDRESS=127.0.0.1 ND_SCANNER_SCHEDULE=0 nohup ./navidrome > nd.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:14533/ping && break; sleep 1; done
          curl -s -X POST http://127.0.0.1:14533/auth/createAdmin -H 'Content-Type: application/json' -d '{"username":"mat","password":"Haslo-123"}' > /dev/null
          for i in $(seq 1 60); do n=$(curl -s "http://127.0.0.1:14533/rest/search3?u=mat&p=Haslo-123&v=1.16.1&c=ci&f=json&query=&songCount=10" | grep -o '"suffix"' | wc -l || true); [ "$n" -ge 2 ] && break; sleep 1; done
          echo "songs indexed: $n"
      - run: cd android && ./gradlew --no-daemon -Ptarget-platform=android-arm64 :app:testReleaseUnitTest
        env:
          MYTIFY_SMB_HOST: 127.0.0.1
          MYTIFY_SMB_SHARE: music
          MYTIFY_SMB_USER: mytifysmb
          MYTIFY_SMB_PASSWORD: Mytify-Test-2026!
          MYTIFY_DAV_URL: https://localhost:18443/dav/
          MYTIFY_DAV_UNTRUSTED_URL: https://localhost:18444/dav/
          MYTIFY_NORANGE_URL: https://localhost:18445/
          MYTIFY_DAV_PASSWORD: Haslo-123
          MYTIFY_SUBSONIC_URL: http://127.0.0.1:14533
          MYTIFY_SUBSONIC_USER: mat
          MYTIFY_SUBSONIC_PASSWORD: Haslo-123
      - uses: actions/upload-artifact@v4
        with:
          name: Mytify-Android
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish to branch builds-android
        shell: bash
        run: |
          mkdir -p publish-out && cp build/app/outputs/flutter-apk/app-release.apk publish-out/
          cd publish-out && git init -q && git checkout -q -b builds-android
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:builds-android
