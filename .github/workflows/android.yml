name: Android test APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --release --target-platform android-arm64 --no-pub
      - run: cd android && ./gradlew --no-daemon -Ptarget-platform=android-arm64 :app:testReleaseUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Mytify-0.6-Android-test
          path: build/app/outputs/flutter-apk/app-release.apk
