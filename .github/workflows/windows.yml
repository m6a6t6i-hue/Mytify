name: Windows build
on:
  workflow_dispatch:
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: npm ci --ignore-scripts
        working-directory: tools/web_bridge
      - run: npm run build
        working-directory: tools/web_bridge
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --release --no-pub --no-web-resources-cdn --no-wasm-dry-run
      - name: Local SMB share for the network source tests
        shell: pwsh
        run: |
          $pw = 'Mytify-Test-2026!'
          New-LocalUser -Name mytifysmb -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          $album = Join-Path 'C:\mytify-share' 'Polskie ąę albumy'
          New-Item -ItemType Directory -Force $album | Out-Null
          New-Item -ItemType Directory -Force 'C:\mytify-local' | Out-Null
          Copy-Item test\fixtures\sample.flac 'C:\mytify-local\a.flac'
          Copy-Item test\fixtures\sample.flac (Join-Path $album 'a.flac')
          Copy-Item test\fixtures\sample.mp3 (Join-Path $album 'Zażółć gęślą jaźń.mp3')
          icacls 'C:\mytify-share' /grant 'mytifysmb:(OI)(CI)R' | Out-Null
          New-SmbShare -Name music -Path 'C:\mytify-share' -ReadAccess mytifysmb | Out-Null
          Get-SmbShare music
      - run: cargo test --locked -- --nocapture --test-threads=1
        working-directory: native/mytify_core
        env:
          MYTIFY_SMB_HOST: localhost
          MYTIFY_SMB_SHARE: music
          MYTIFY_SMB_USER: mytifysmb
          MYTIFY_SMB_PASSWORD: Mytify-Test-2026!
          MYTIFY_SMB_LOCAL: C:\mytify-local
      - run: cargo build --locked --release --features desktop,embed-ui
        working-directory: native/mytify_core
        env:
          # Static CRT: runs without the Visual C++ redistributable installed.
          RUSTFLAGS: -C target-feature=+crt-static
      - uses: actions/upload-artifact@v4
        with:
          name: Mytify-Windows
          path: native/mytify_core/target/release/mytify.exe
      - name: Publish to branch builds-windows
        shell: bash
        run: |
          mkdir -p publish-out && cp native/mytify_core/target/release/mytify.exe publish-out/
          cd publish-out && git init -q && git checkout -q -b builds-windows
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:builds-windows
