name: Check
on:
  push:
    branches: [redesign]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test || true
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  screenshots:
    runs-on: ubuntu-latest
    needs: check
    env:
      SCREENSHOTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub --update-goldens test/screenshots_test.dart || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/goldens/*.png
