name: Check
on:
  push:
    branches: [redesign]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test || true
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  screenshots:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: check
    env:
      SCREENSHOTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub --update-goldens test/screenshots_test.dart || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test/goldens/*.png
      - name: Publish to branch screens
        shell: bash
        run: |
          mkdir -p publish-out && cp test/goldens/*.png publish-out/
          cd publish-out && git init -q && git checkout -q -b screens
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:screens
